[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dc-options"
version = "0.1.0"
description = "Dataclass-driven configuration helpers with metadata, validation, path access, argparse integration, and documentation generation."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Libor Wagner", email = "libor.wagner@cvut.cz" }
]

requires-python = ">=3.9"

dependencies = [
    "dacite>=1.8",
    "jinja2>=3.1"
]
